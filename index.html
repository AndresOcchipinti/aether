const $=s=>document.querySelector(s),cl=v=>Math.max(1,Math.min(10,Math.round(v)));

let apiLiveData = null;
const P={'Ana Reyes':{age:38,seed:3,fc:64,fcd:2,sp:98,spd:.5,pas:116,an:8,and:5,ba:1,bone:.8,iop:1,rad:1,rr:3,st:0,hv:55,hvd:-3,s0:70,sd:5,r0:75,rdd:-5,sl0:86,sld:-2,re0:84,red:-2,rp0:14,rpd:.4,t0:36.5,td:.1},

'Mei Tanaka':{age:34,seed:11,fc:62,fcd:1,sp:98,spd:.3,pas:112,an:8,and:0,ba:-1,bone:.7,iop:0,rad:.9,rr:3,st:0,hv:62,hvd:0,s0:55,sd:0,r0:85,rdd:0,sl0:88,sld:0,re0:86,red:0,rp0:13.5,rpd:0,t0:36.4,td:0}};
const NAMES=Object.keys(P),DB={};

// Carga inicial de datos base simulados
for(const n in P){const p=P[n],r=mb(p.seed);DB[n]=[...Array(14)].map((_,i)=>{const t=i/13,e=()=>r()-.5;
return{dia:i+1,fc:Math.round(p.fc+p.fcd*t+e()*4),rr:+(3+p.rr*t+e()*2).toFixed(1),st:+(p.st*t+e()*.1).toFixed(1),pas:Math.round(p.pas+e()*6+p.fcd/2*t),pad:Math.round(p.pas*.65+e()*4),sp:+(p.sp-p.spd*t+e()).toFixed(1),an:cl(p.an-p.and*t+e()*2),su:cl(7-p.and*t*.6+e()*2),hi:cl(8+e()*2),al:cl(7+e()*2-p.and*t*.3),ej:cl(7+e()*2-p.and*t*.5),hu:+(-.045*(i+1)*p.bone).toFixed(2),mu:+(-.06*(i+1)*p.bone).toFixed(2),pio:+(15+p.iop*t+e()).toFixed(1),ds:+(p.rad*(i+1)*.6).toFixed(1),ed:+(p.age+p.ba*t+e()*.4).toFixed(1)}})}
const MC=(d,h)=>[['Stress/recovery balance',Math.min(1,d.rs/(d.rs+d.ss)*1.6),35],['HRV vs own baseline',Math.min(1,d.hv/h),25],['Sleep score',d.sl/100,25],['Readiness',d.rd/100,15]],
RM=(d,h)=>cl(1+9*MC(d,h).reduce((a,x)=>a+x[1]*x[2]/100,0));
for(const n in P){const p=P[n],r=mb(p.seed+100);DB[n].forEach((d,i)=>{const t=i/13,e=()=>r()-.5,g=(a,b,k)=>a+b*t+e()*k;
d.hv=Math.round(g(p.hv,p.hvd,6));d.ss=Math.max(5,Math.round(g(p.s0,p.sd,24)));d.rs=Math.max(2,Math.round(g(p.r0,p.rdd,20)));d.en=Math.round(110+e()*30);d.rl=Math.round(140+e()*30);
d.sl=Math.min(100,Math.max(30,Math.round(g(p.sl0,p.sld,8))));d.rd=Math.min(100,Math.max(30,Math.round(g(p.re0,p.red,8))));d.rsp=+g(p.rp0,p.rpd,.6).toFixed(1);
d.tc=+g(p.t0,p.td,.3).toFixed(2);d.sk=+(d.tc-p.t0).toFixed(2);d.ma=RM(d,p.hv)})}

// Función para conectar y obtener datos de la API de Vercel
async function fetchVercelApi() {
  try {
    const res = await fetch('https://nasafasta.vercel.app/api/astronauts'); // Ajustar endpoint según Swagger si es necesario
    if(!res.ok) throw new Error('Network response was not ok');
    const data = await res.json();
    apiLiveData = data;
    
    // Si la API devuelve un objeto de telemetría, actualizamos el último registro del astronauta activo
    if(data) {
      const currentAstronaut = sel || 'Ana Reyes';
      if(DB[currentAstronaut] && DB[currentAstronaut].length > 0) {
        const lastIdx = DB[currentAstronaut].length - 1;
        if(data.frecuencia_cardiaca_lpm_fisio) DB[currentAstronaut][lastIdx].fc = data.frecuencia_cardiaca_lpm_fisio;
        if(data.presion_sistolica_mmHg) DB[currentAstronaut][lastIdx].pas = data.presion_sistolica_mmHg;
        if(data.presion_diastolica_mmHg) DB[currentAstronaut][lastIdx].pad = data.presion_diastolica_mmHg;
        if(data.variabilidad_frecuencia_cardiaca_ms) DB[currentAstronaut][lastIdx].hv = data.variabilidad_frecuencia_cardiaca_ms;
        if(data.rendimiento) DB[currentAstronaut][lastIdx].rd = Math.round(data.rendimiento * 10);
        if(data.densidad_osea_g_cm2) DB[currentAstronaut][lastIdx].hu = parseFloat(((data.densidad_osea_g_cm2 - 1.2) * 10).toFixed(2));
        if(data.afectar_afecto_positivo) DB[currentAstronaut][lastIdx].an = data.afectar_afecto_positivo;
        
        // Nuevas columnas dinámicas desde API
        DB[currentAstronaut][lastIdx].volumen_sanguineo = data.volumen_sanguineo_L;
        DB[currentAstronaut][lastIdx].vo2_max = data.vo2_max_ml_kg_min;
        DB[currentAstronaut][lastIdx].cohesion_equipo = data.cohesion_equipo;
        DB[currentAstronaut][lastIdx].carga_mental = data.carga_trabajo_mental;
      }
    }
    const stEl = $('#api-status');
    if(stEl) { stEl.textContent = '● API Vercel conectada (En vivo)'; stEl.style.color = 'var(--ok)'; }
    draw();
  } catch(e) {
    console.warn('Usando respaldo local por error en API:', e);
    const stEl = $('#api-status');
    if(stEl) { stEl.textContent = '● Modo Local / API Simulada'; stEl.style.color = 'var(--wa)'; }
  }
}

const UN={C:'°C',F:'°F',K:'K'},fT=c=>(TU=='F'?c*1.8+32:TU=='K'?c+273.15:c).toFixed(1)+' '+UN[TU],fD=c=>{const v=TU=='F'?c*1.8:c;return(v>0?'+':'')+v.toFixed(2)+' '+UN[TU]};

const CK={},PLAN={

<details class="card"><summary>What the ring measures and how it infers stress</summary>  
<div class="sc"><table><tr><th>Signal</th><th>Sensor</th><th>Use</th></tr>  
<tr><td>Heart rate, HRV</td><td>Green + infrared LEDs (PPG, 18 paths)</td><td>24/7; HRV is the main stress marker</td></tr>  
<tr><td>Blood oxygen, respiration</td><td>Red + infrared LEDs</td><td>Measured during sleep</td></tr>  
<tr><td>Skin temperature</td><td>Digital temperature sensor</td><td>Deviation from personal baseline</td></tr>  
<tr><td>Movement</td><td>Accelerometer</td><td>Activity, sleep, and pausing stress analysis during exercise</td></tr></table></div>
<p><b>Daytime Stress.</b> While awake and still, it compares HRV, heart rate, motion and finger skin temperature with the person’s own baseline. Lower HRV, faster heart rate and cooler fingers (blood vessels narrow under stress) point to stress. Output zones: Stressed, Engaged, Relaxed, Restored.</p>
<p><b>Resilience.</b> A 14-day balance of daytime stress, daytime recovery and night recovery (sleep score, resting heart rate, HRV balance, recovery index), from Limited to Exceptional. A 31-day Cumulative Stress view also exists.</p>
<p><b>Mood.</b> The ring does not measure mood. It measures physiological stress, which is not the same as psychological stress: alcohol, sauna, illness or exercise also raise it. The estimated mood here is an AETHER proxy built from the four factors above, so treat it as an indicator and compare it with the manual check-in.</p>
<p><b>Skin vs core temperature.</b> The ring reports skin-temperature deviation, not core temperature. The body temperature in Mission is the personal baseline plus that deviation (simulated).</p>
<p class="note" style="margin:0">Designed for everyday life on Earth. Microgravity may shift HRV and temperature baselines, so interpret against the mission’s own baselines.</p></details>`},

if(h('bone','muscle'))o.push(`${c('bone density')}: ${d.hu}% · muscle mass ${d.mu}% → ${E[S.Structure(d)]}`);
if(h('eye','vision','ocular'))o.push(`${c('eye pressure')}: ${d.pio} mmHg → ${E[S.Vision(d)]}`);
if(h('radiation','dose'))o.push(`${c('cumulative radiation dose')}: ${d.ds} mSv → ${E[S.Exposure(d)]}`);
if(w.includes('age')||h('biological'))o.push(`${c('estimated biological age')}: ${d.ed} yrs (chronological ${P[n].age})`);
if(!o.length)Object.keys(S).filter(k=>!me||k!='Ring').forEach(k=>o.push(`${k}: ${E[S[k](d,n)]}`));
return`<b>${me?'Status actual':n}</b> · day ${d.dia}<br>`+o.join('<br>')}
</script></body></html>
